[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aie"
version = "0.1.0"
description = "Outils pédagogiques accompagnant la lecture de AI Engineering (Chip Huyen)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["aie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
